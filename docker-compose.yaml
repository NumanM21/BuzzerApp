version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: buzzer-postgres
    restart: always
    environment:
      POSTGRES_USER: buzzer_user
      POSTGRES_PASSWORD: supersecretpassword
      POSTGRES_DB: buzzer_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: